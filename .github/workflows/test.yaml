name: "Test"

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [master]

jobs:
  test:
    name: "Test"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      #- name: "Debug event.json"
      #  run: |
      #    cat "${GITHUB_EVENT_PATH}"

      - name: "Test to JSON"
        id: json
        uses: ./
        with:
          source: .github/test/test.env
          dest: .github/test/results.json

      - name: "Verify JSON"
        run: |
          echo '${{ steps.json.outputs.result }}'
          cat .github/test/results.json
          set -e
          if [ '${{ steps.json.outputs.result }}' != "$(cat .github/test/results.json)" ];then
            echo "JSON Verification Failed: results.json"
            exit 1
          fi

      - name: "Test to Environment"
        id: env
        uses: ./
        if: ${{ !github.event.act }}
        with:
          source: .github/test/test.json
          dest: .github/test/results.env
          type: "env"
          sensitive: true

      - name: "Verify Environment"
        if: ${{ !github.event.act }}
        run: |
          echo '${{ steps.env.outputs.result }}'
          cat .github/test/results.env
          if [ '${{ steps.env.outputs.result }}' != "$(cat .github/test/results.env)" ];then
            echo "Environment Verification Failed: results.env"
            exit 1
          fi

  lint:
    name: "Lint"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Setup Node 20"
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: "ESLint"
        run: |
          npm install
          npm run lint

  build:
    name: "Build"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Setup Node 20"
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: "Build"
        run: |
          npm install
          npm run build

      - name: "Verify"
        run: |
          git status --porcelain dist/
          if [ ! -d "dist" ];then
            echo "Missing dist directory, run: npm build"
            exit 1
          fi
          if [ -n "$(git status --porcelain dist)" ];then
            echo "Build was not run, run: npm build"
            exit 1
          fi
